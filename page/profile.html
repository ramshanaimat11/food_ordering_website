<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Food Hub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="home.html" class="brand"><i class="fas fa-fire-flame-curved"></i> FOOD<span>HUB</span></a>
            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="order-history.html">Orders</a>
                <button class="cart-trigger-btn" onclick="window.location.href='cart.html'">
                    <i class="fas fa-shopping-bag"></i> Cart <span class="badge">0</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container account-layout">
        <aside class="account-sidebar">
            <div class="user-mini-card">
                <div class="user-avatar" id="userAvatarInitial">U</div>
                <h3 id="sidebarUserName">User</h3>
                <p id="sidebarUserEmail" style="font-size:12px; color:var(--text-muted);"></p>
            </div>
            <nav class="sidebar-nav">
                <a href="profile.html" class="active"><i class="fas fa-user"></i> My Profile</a>
                <a href="address.html"><i class="fas fa-map-marker-alt"></i> Saved Addresses</a>
                <a href="order-history.html"><i class="fas fa-receipt"></i> Order History</a>
                <a href="dashboard.html"><i class="fas fa-chart-line"></i> Admin Panel</a>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </nav>
        </aside>

        <section>
            <div class="account-card">
                <h2><i class="fas fa-user-edit" style="color:var(--primary); margin-right:8px;"></i> Profile Information</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profName">Full Name</label>
                        <input type="text" id="profName" required>
                    </div>
                    <div class="form-group">
                        <label for="profEmail">Email Address (Read-Only)</label>
                        <input type="email" id="profEmail" readonly style="opacity:0.7;">
                    </div>
                    <div class="form-group">
                        <label for="profPhone">Phone Number</label>
                        <input type="tel" id="profPhone" required>
                    </div>
                    <button type="submit" class="primary-btn">Save Changes</button>
                </form>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/security.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/session.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
