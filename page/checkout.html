<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flavor Hub | Secure Checkout</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="nav-container">

            <a href="home.html" class="brand">
                <i class="fas fa-fire-flame-curved"></i>
                FLAVOR <span>HUB</span>
            </a>

            <nav class="nav-links">
                <a href="home.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="cart.html">Cart</a>
            </nav>

        </div>
    </header>

    <!-- Checkout Main Section -->
    <main class="container checkout-container">

        <div class="checkout-heading">
            <h1>Secure Checkout</h1>
            <p>Complete your details and enjoy your delicious meal!</p>
        </div>

        <form id="checkoutForm">

            <!-- Customer Information -->
            <section class="checkout-section">

                <h2>
                    <i class="fas fa-user"></i>
                    Customer Information
                </h2>

                <label for="customerName">Full Name</label>
                <input type="text" id="customerName"
                       placeholder="Enter your full name" required>

                <label for="customerEmail">Email Address</label>
                <input type="email" id="customerEmail"
                       placeholder="Enter your email" required>

                <label for="customerPhone">Phone Number</label>
                <input type="tel" id="customerPhone"
                       placeholder="Enter your phone number" required>

            </section>

            <!-- Delivery Address -->
            <section class="checkout-section">

                <h2>
                    <i class="fas fa-map-marker-alt"></i>
                    Delivery Address
                </h2>

                <label for="streetAddress">Street Address</label>
                <input type="text" id="streetAddress"
                       placeholder="House number, street name" required>

                <label for="city">City</label>
                <input type="text" id="city"
                       placeholder="Enter your city" required>

                <label for="postalCode">Postal Code</label>
                <input type="text" id="postalCode"
                       placeholder="Enter postal code" required>

                <label for="deliveryInstructions">
                    Delivery Instructions
                </label>

                <textarea id="deliveryInstructions"
                          placeholder="Any special delivery instructions?"></textarea>

            </section>

            <!-- Payment Method -->
            <section class="checkout-section">

                <h2>
                    <i class="fas fa-credit-card"></i>
                    Payment Method
                </h2>

                <label class="payment-option">
                    <input type="radio"
                           name="paymentMethod"
                           value="Cash on Delivery"
                           checked>
                    <span>
                        <i class="fas fa-money-bill-wave"></i>
                        Cash on Delivery
                    </span>
                </label>

            </section>

            <!-- Order Summary -->
            <section class="checkout-section">

                <h2>
                    <i class="fas fa-receipt"></i>
                    Order Summary
                </h2>

                <div id="checkoutItems">
                    <!-- Cart items will appear here -->
                </div>

                <div class="checkout-total">
                    <span>Total Amount</span>
                    <strong id="checkoutTotal">$0.00</strong>
                </div>

            </section>

            <!-- Place Order -->
            <button type="submit"
                    id="placeOrderBtn"
                    class="primary-btn full-width">

                <i class="fas fa-check-circle"></i>
                Place Order

            </button>

        </form>

    </main>

    <!-- Notification -->
    <div id="toast" class="toast"></div>

    <!-- JavaScript -->
    <script src="../js/checkout.js"></script>

</body>
</html>
